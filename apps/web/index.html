<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the page reaches under a notch; the shell pads itself
         back out with the safe-area insets. -->
    <!-- `user-scalable=no` and `maximum-scale` are honoured by Chrome and Android and
         deliberately ignored by iOS Safari, which will not let a page take pinch-zoom
         away. Double-tap zoom is killed properly in CSS instead; see tokens.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- The one place a raw colour is unavoidable: a meta tag cannot read a custom
         property. It is `--ground`, and it is the only copy of it outside tokens.css. -->
    <meta name="theme-color" content="#08070a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dread Majesty" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Dread Majesty</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
