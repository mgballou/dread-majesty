name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the branch to be current with its base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Fails, rather than skips, a PR behind its base: a skipped check reads
        # as a pass with no tests run.
        run: |
          behind=$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" --jq .behind_by)
          if [ "$behind" != "0" ]; then
            echo "::error::This branch is $behind commits behind $BASE. Update it to run CI."
            exit 1
          fi

  check:
    needs: gate
    runs-on: ubuntu-latest
    # The whole job takes under a minute. A hang should cost minutes, not hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json. Setting it here too
      # is an error, not a belt-and-braces.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # There is a real app now, and a Vite build fails on things tsc does not see —
      # a bad asset path, an import that only resolves under the dev server.
      - run: pnpm build
