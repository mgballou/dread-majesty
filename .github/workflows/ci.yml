name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.base.outputs.run }}
    steps:
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          behind=$(gh api "repos/${{ github.repository }}/compare/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}" --jq .behind_by)
          if [ "$behind" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::This branch is $behind commits behind ${{ github.base_ref }}. Update it to run CI."; echo "run=false" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json. Setting it here too
      # is an error, not a belt-and-braces.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # There is a real app now, and a Vite build fails on things tsc does not see —
      # a bad asset path, an import that only resolves under the dev server.
      - run: pnpm build
